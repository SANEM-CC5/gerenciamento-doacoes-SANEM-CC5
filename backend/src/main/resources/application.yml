server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: javalovers-backend

  datasource:
    # PostgreSQL (NeonDB). Valores reais vêm do ambiente (.env):
    # SPRING_DATASOURCE_URL=jdbc:postgresql://<host>/<db>?sslmode=require
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sanem}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        hbm2ddl:
          auto: none
        cache:
          use_second_level_cache: false
          use_query_cache: false

  # Por padrão (produção) a Flyway aplica SOMENTE o schema (db/migration),
  # sem dados de exemplo. O seed fica em db/seed e é habilitado apenas no
  # profile "dev" (ver application-dev.yml).
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.javalovers: DEBUG
    org.springframework.security: DEBUG


sanem:
  notifications:
    # RF19 – perfis que recebem alerta quando um item atinge o estoque mínimo
    # (comparação sem diferenciar maiúsculas/minúsculas com profile.name)
    low-stock-profiles: ${LOW_STOCK_NOTIFIED_PROFILES:Administrator,Attendant}

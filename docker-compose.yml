services:
  backend:
    build: ./backend
    container_name: javalovers-backend
    restart: always
    ports:
      - "8080:8080"
    # Banco: PostgreSQL hospedado no NeonDB.
    # As variáveis (SPRING_DATASOURCE_URL/USERNAME/PASSWORD e SPRING_PROFILES_ACTIVE)
    # vêm do .env (não versionado) e são passadas LITERALMENTE ao container.
    # Ver .env.example.
    env_file:
      - .env
    networks:
      - javalovers-network

  frontend:
    build: ./frontend
    container_name: javalovers-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080/api
    depends_on:
      - backend
    networks:
      - javalovers-network

networks:
  javalovers-network:
    driver: bridge
